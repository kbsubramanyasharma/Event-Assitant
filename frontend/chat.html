<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Catering Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="chat-body">
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="app-container slide-up">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2>Caterina AI</h2>
                <div class="user-badge" id="userBadge">User</div>
            </div>

            <div class="sidebar-content">
                <nav class="sidebar-nav">
                    <button class="nav-btn active" id="navChatBtn" onclick="switchView('chat')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        Chat
                    </button>
                    <button class="nav-btn" id="navBookingsBtn" onclick="switchView('bookings')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        My Bookings
                    </button>
                </nav>
            </div>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn secondary-btn">Log out</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main glass-panel" id="chatView">
            <div class="chat-header">
                <h3>Shift Logging Assistant</h3>
                <span class="status-indicator"></span>
            </div>

            <div class="chat-messages" id="chatBox">
                <!-- Messages will be injected here by app.js -->
                <div class="message bot-message fade-in">
                    <div class="message-content">
                        Hello! I'm your catering scheduler assistant. How can I help you log your shift today?
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <form id="chatForm">
                    <button type="button" class="mic-btn" id="micBtn" title="Hold to record audio">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                    </button>
                    <input type="text" id="messageInput" autocomplete="off"
                        placeholder="Log shift dates, location, salary..." required>
                    <button type="submit" class="send-btn" id="sendBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>

        <!-- Bookings Data Area -->
        <main class="bookings-main glass-panel fade-in" id="bookingsView" style="display: none;">
            <div class="chat-header">
                <h3>My Logged Bookings</h3>
            </div>
            <div class="bookings-content">
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Guests</th>
                            <th>Salary</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
                <p id="noBookingsMsg" class="empty-state" style="display: none;">No bookings found yet. Use the chat to log an upcoming shift!</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        // Check authentication on chat page load
        document.addEventListener('DOMContentLoaded', () => {
            const username = localStorage.getItem('username');
            if (!username) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('userBadge').innerText = username;
                loadHistory();
            }
        });
    </script>
</body>

</html>
